dsl_definitions:

  # Reads the VM's IP addresses over SSH through the Endpoint proxy. Runs at
  # install (start) and after a deployment update (update), so the IP
  # capabilities follow a segment change.
  get_vm_info: &get_vm_info
    implementation: fabric.fabric_plugin.tasks.run_script
    inputs:
      script_path: vm/scripts/get_vm_info.sh
      hide_output: ["stdout"]
      fabric_env:
        host_string: { get_attribute: [vm, vm_details, name] }
        user: { get_input: vm_user_name }
        key: { get_secret: { get_input: ssh_private_key_secret } }
        port: 22
      proxy_settings:
        auto_resolve: false
        enable_socks5: false
        target_id: { get_attribute: [proxy_resolver, _proxy_target_id] }
        target_ip: { get_attribute: [vm, vm_details, name] }

  # For nodes whose settings only apply when the VM is created: they never
  # drift, so a deployment update never reinstalls them.
  no_drift: &no_drift
    implementation: vm/scripts/no_drift.py
    executor: central_deployment_agent

node_templates:

  # Refuses a direct update of a utility deployment that a parent blueprint
  # manages (see vm/scripts/update_guard.py). Its check_drift fails the
  # update in the drift-check phase, before any node changes. No
  # relationships, so adding it to a running deployment changes no other node.
  update_guard:
    type: dell.nodes.Root
    interfaces:
      dell.interfaces.lifecycle:
        check_drift:
          implementation: vm/scripts/update_guard.py
          executor: central_deployment_agent

  cloudinit:
    type: dell.nodes.CloudInit.CloudConfig
    properties:
      resource_config: { get_input: cloudinit }
    interfaces:
      dell.interfaces.lifecycle:
        # Cloud-init only runs at first boot.
        check_drift: *no_drift

  proxy_resolver:
    type: dell.nodes.ApplicationModule
    interfaces:
      dell.interfaces.lifecycle:
        precreate:
          implementation: vm/scripts/get_proxy.py
          executor: central_deployment_agent
          inputs:
            service_tag: { get_input: service_tag }

  # Serial ports are set at creation (serial_port can't be updated). Writes
  # runtime properties only, so there is nothing to undo on uninstall.
  format_serial_ports:
    type: dell.nodes.Root
    interfaces:
      dell.interfaces.lifecycle:
        create:
          implementation: vm/scripts/prepare_serial_ports.py
          executor: central_deployment_agent
          inputs:
            serial_port: { get_input: serial_port }
        check_drift: *no_drift

  vm:
    type: dell.nodes.nativeedge.template.NativeEdgeVM
    properties:
      vm_config:
        location: { get_input: service_tag }
        name: { get_input: name }
        image: { get_input: image }
        os_type: { get_input: os_type }
        resource_constraints:
          cpu: { get_input: cpu }
          memory: { get_input: memory }
          storage: { get_input: storage }
          disk: { get_input: disk }
          controller: { get_input: disk_controller }
        hardware_options:
          vTPM: { get_input: hardware_options.vTPM }
          secure_boot: { get_input: hardware_options.secure_boot }
          firmware_type: { get_input: hardware_options.firmware_type }
        enable_management: { get_input: enable_management }
        network_settings: { get_input: network_settings }
        ports:
          usb: { get_input: usb }
          serial_port: { get_attribute: [format_serial_ports, serial_ports_list] }
          gpu: { get_input: gpu }
          video: { get_input: video }
          pcie: { get_input: pcie }
        cloudinit: { get_attribute: [cloudinit, cloud_config] }
        iso_files: { get_input: iso_files }
        boot_order: { get_input: boot_order }
        additional_disks: { get_input: additional_disks }
    interfaces:
      dell.interfaces.lifecycle:
        # Replaces the edge-plugin's check_drift, which always reports drift
        # (so every update sent the VM a no-op update, and the deployment
        # stayed "drifted" afterwards).
        check_drift:
          implementation: vm/scripts/vm_check_drift.py
          executor: central_deployment_agent
        # The edge-plugin's update_config/update_apply apply the change; this
        # checks the VM record afterwards. update_postapply, not postupdate:
        # the update workflow runs postupdate before update_apply.
        update_postapply:
          implementation: vm/scripts/vm_postupdate.py
          executor: central_deployment_agent
    relationships:
       - type: dell.relationships.depends_on
         target: cloudinit
       - type: dell.relationships.depends_on
         target: format_serial_ports

  # No check_drift on purpose: the update workflow runs its update after the
  # VM it depends on was updated, which refreshes the IP capabilities.
  vm_info:
    type: dell.nodes.Root
    interfaces:
      dell.interfaces.lifecycle:
        start: *get_vm_info
        update: *get_vm_info
    relationships:
       - type: dell.relationships.depends_on
         target: vm
       - type: dell.relationships.depends_on
         target: proxy_resolver
