tosca_definitions_version: dell_1_1

description: >
  Utility blueprint that deploys a single Virtual Machine on a NativeEdge Endpoint
  using cloud-init. Called by the parent blueprint via ServiceComponent.

imports:
  - dell/types/types.yaml
  - plugin:edge-plugin?version= >=3.3.17.0,<4.0.0.0
  - plugin:utilities-plugin?version= >=3.1.4.0,<4.0.0.0
  - plugin:fabric-plugin?version= >=3.4.2.0,<4.0.0.0
  - vm/inputs.yaml
  - vm/outputs.yaml
  - vm/blueprint.yaml

input_groups:
  vm_basic:
    display_label: Virtual Machine
    collapsible: true
    index: 0
    inputs:
      - service_tag
      - name
      - image
      - os_type
      - vm_hostname
      - vm_user_name
      - ssh_private_key_secret
      - cloudinit
  vm_resources:
    display_label: Resources
    collapsible: true
    index: 1
    inputs:
      - cpu
      - memory
      - storage
      - disk
      - disk_controller
      - additional_disks
      - hardware_options.firmware_type
      - hardware_options.secure_boot
      - hardware_options.vTPM
  vm_network:
    display_label: Network
    collapsible: true
    index: 2
    inputs:
      - network_settings
      - enable_management
  vm_devices:
    display_label: Devices and Boot
    collapsible: true
    index: 3
    inputs:
      - usb
      - serial_port
      - gpu
      - video
      - pcie
      - iso_files
      - boot_order

labels:
  csys-obj-type:
    values:
      - environment
  version:
    values:
      - "1.2.0.0"

blueprint_labels:
  csys-blueprint-type:
    values:
      - utility
  env:
    values:
      - NED
